<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trainer Monitor</title><style>body{font:18px system-ui;background:#101827;color:white;max-width:520px;margin:40px auto;padding:20px}button{padding:16px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.tile{background:#1e293b;padding:22px;border-radius:12px}.tile:first-child{grid-column:span 2}.num{font-size:40px;font-weight:bold}</style><h1>🚴 Trainer Monitor</h1><p id="status">Disconnected</p><button id="connect">Connect Trainer</button><div class="grid"><div class="tile">POWER<div class="num" id="power">—</div>watts</div><div class="tile">CADENCE<div class="num" id="cadence">—</div>rpm</div><div class="tile">SPEED<div class="num" id="speed">—</div>km/h (not yet supported)</div></div><script>
const $=id=>document.getElementById(id);
let previousCrank=null;
function measurement(event){
 const v=event.target.value;let p=0;
 const u8=()=>v.getUint8(p++);
 const u16=()=>{const x=v.getUint16(p,true);p+=2;return x};
 const s16=()=>{const x=v.getInt16(p,true);p+=2;return x};
 const u32=()=>{const x=v.getUint32(p,true);p+=4;return x};
 try{
 const flags=u16();
 $('power').textContent=s16();
 if(flags&1)p+=1; // pedal power balance
 if(flags&2)p+=2; // accumulated torque
 if(flags&4)p+=4; // wheel revolutions
 if(flags&4)p+=2; // last wheel event time
 if(flags&8){
   const rev=u16(),time=u16();
   if(previousCrank){
     const dr=(rev-previousCrank.rev+65536)%65536;
     const dt=(time-previousCrank.time+65536)%65536;
     if(dt>0&&dr>0&&dt<10*1024)$('cadence').textContent=Math.round(dr*60*1024/dt);
   }
   previousCrank={rev,time};
 }
 $('status').textContent='Connected — receiving power data';
 }catch(err){$('status').textContent='Measurement error: '+err.message;}
}
$('connect').onclick=async()=>{
 try{
 if(!navigator.bluetooth)throw Error('Web Bluetooth unavailable: open in Chrome on Android');
 $('status').textContent='Choose Magnus…';
 const d=await navigator.bluetooth.requestDevice({filters:[{services:[0x1818]}],optionalServices:[0x180a]});
 d.addEventListener('gattserverdisconnected',()=>{$('status').textContent='Disconnected';$('connect').disabled=false;});
 $('status').textContent='Connecting…';
 const server=await d.gatt.connect();
 const service=await server.getPrimaryService(0x1818);
 const characteristic=await service.getCharacteristic(0x2a63);
 characteristic.addEventListener('characteristicvaluechanged',measurement);
 await characteristic.startNotifications();
 $('status').textContent='Connected: '+d.name;
 $('connect').disabled=true;
 }catch(err){$('status').textContent=err.name+': '+err.message;}
};
</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trainer Monitor</title><style>body{font:18px system-ui;background:#101827;color:white;max-width:520px;margin:40px auto;padding:20px}button{padding:16px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.tile{background:#1e293b;padding:22px;border-radius:12px}.tile:first-child{grid-column:span 2}.num{font-size:40px;font-weight:bold}</style><h1>🚴 Trainer Monitor</h1><p id="status">Disconnected</p><button id="connect">Connect Trainer</button><div class="grid"><div class="tile">POWER<div class="num" id="power">—</div>watts</div><div class="tile">CADENCE<div class="num" id="cadence">—</div>rpm</div><div class="tile">SPEED<div class="num" id="speed">—</div>km/h</div></div><script>const $=id=>document.getElementById(id);$('connect').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('Web Bluetooth unavailable: use Chrome on Android via HTTPS');$('status').textContent='Choose trainer';const d=await navigator.bluetooth.requestDevice({filters:[{services:[0x1826]}]});d.addEventListener('gattserverdisconnected',()=>{$('status').textContent='Disconnected'});const s=await d.gatt.connect();const c=await(await s.getPrimaryService(0x1826)).getCharacteristic(0x2ad2);c.addEventListener('characteristicvaluechanged',e=>{const v=e.target.value;let i=0;const u16=()=>{const n=v.getUint16(i,true);i+=2;return n};const s16=()=>{const n=v.getInt16(i,true);i+=2;return n};const f=u16();if(!(f&1))$('speed').textContent=(u16()/100).toFixed(1);if(f&2)i+=2;if(f&4)$('cadence').textContent=(u16()/2).toFixed(0);if(f&8)i+=2;if(f&16)i+=3;if(f&32)i+=2;if(f&64)$('power').textContent=s16();});await c.startNotifications();$('status').textContent='Connected: '+d.name;}catch(e){$('status').textContent=e.message}};</script></html>
